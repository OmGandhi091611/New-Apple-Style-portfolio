<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Photos — Om Amit Gandhi" />
    <title>Photos — Om Amit Gandhi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/photos-main.jsx"></script>
  </body>
</html>
